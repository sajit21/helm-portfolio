apiVersion: v1
kind: Service

metadata:
  name: portfolio-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    app: portfolio-frontend

  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP