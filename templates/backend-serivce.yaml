apiVersion: v1
kind: Service

metadata:
  name: portfolio-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}

spec:
  type: {{ .Values.backend.service.type }}

  selector:
    app: portfolio-backend

  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP